<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cher's Digital Closet</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cher: {
                            hotpink: '#FF1493',
                            brightpink: '#FF69B4',
                            lightpink: '#FFB6C1',
                            softpink: '#FFD1DC',
                            glitterdark: '#0a0006',
                            carddark: '#14030a'
                        }
                    },
                    fontFamily: {
                        pixel: ['"Courier New"', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url('https://i.pinimg.com/736x/d7/9d/ec/d79dec51b5c1026343557972fbd27898.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'VT323', monospace;
            font-size: 20px;
        }

        /* HEADER BACKGROUND */
        .header-bg {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.6)), url('https://i.pinimg.com/1200x/3f/be/53/3fbe53a05ce82d12f00dfda33391b362.jpg');
            background-size: cover;
            background-position: center;
        }

        /* RETRO PIXEL GLITTER BUTTONS */
        .pixel-btn {
            background: linear-gradient(135deg, #FF69B4 0%, #FF1493 50%, #C71585 100%);
            border: 3px solid #FFF;
            box-shadow: 4px 4px 0px #000, 0 0 10px rgba(255, 20, 147, 0.9);
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            text-transform: uppercase;
            image-rendering: pixelated;
            transition: all 0.1s ease;
        }
        .pixel-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 5px 5px 0px #000, 0 0 15px rgba(255, 105, 180, 1);
        }
        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        /* RETRO WINDOW / CONTAINER BOX */
        .retro-box {
            background: rgba(15, 2, 10, 0.95);
            border: 3px solid #FF1493;
            box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(255, 20, 147, 0.2);
        }

        /* TRANSPARENT SLOT CONTAINER */
        .slot-container {
            background-color: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(3px);
            border: 2px dashed rgba(255, 105, 180, 0.6);
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .slot-container:hover {
            background-color: rgba(255, 255, 255, 0.18);
            border-color: #FF1493;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.4);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0006;
            border: 1px solid #FF1493;
        }
        ::-webkit-scrollbar-thumb {
            background: #FF1493;
            border: 1px solid #fff;
        }
    </style>
</head>
<body class="min-h-screen text-white flex flex-col justify-between selection:bg-cher-hotpink selection:text-white">

    <!-- TOP GLITTER IMAGE HEADER -->
    <header class="header-bg w-full border-b-4 border-cher-hotpink sticky top-0 z-40 px-4 sm:px-8 py-3 shadow-2xl">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            
            <!-- Navigation Controls -->
            <nav class="flex items-center space-x-3">
                <button id="nav-match" onclick="switchTab('match')" class="pixel-btn px-4 py-3 text-white bg-cher-hotpink">
                    <img src="https://dl2.glitter-graphics.net/pub/79/79082h0evyh0of3.gif" class="inline-block w-4 h-4 mr-1 object-contain"> Matcher
                </button>
                <button id="nav-wardrobe" onclick="switchTab('wardrobe')" class="pixel-btn px-4 py-3 text-cher-lightpink bg-black/70">
                    <img src="https://dl2.glitter-graphics.net/pub/79/79082h0evyh0of3.gif" class="inline-block w-4 h-4 mr-1 object-contain"> Wardrobe
                </button>
            </nav>

            <!-- User Auth Profile Button -->
            <div class="flex items-center space-x-2">
                <button onclick="openAuthModal()" class="pixel-btn px-3 py-2 text-cher-lightpink bg-black/80 flex items-center space-x-1.5">
                    <img src="https://dl2.glitter-graphics.net/pub/79/79082h0evyh0of3.gif" class="w-4 h-4 object-contain">
                    <span id="auth-status-text">Cloud Sync</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main class="max-w-5xl mx-auto w-full px-3 py-6 flex-grow flex flex-col items-center">

        <!-- TAB 1: OUTFIT MATCHER -->
        <section id="tab-match" class="w-full flex flex-col items-center space-y-6">
            
            <!-- CONTROL BAR BLOCK -->
            <div class="retro-box w-full max-w-xl p-4 rounded-xl flex flex-wrap items-center justify-between gap-3 text-white">
                <div class="flex items-center space-x-2">
                    <img src="https://dl2.glitter-graphics.net/pub/79/79082h0evyh0of3.gif" class="w-6 h-6 object-contain animate-bounce">
                    <span class="font-['Press_Start_2P'] text-[10px] text-cher-lightpink uppercase">Styling Desk</span>
                </div>

                <!-- Controls & Tag Filter Generator -->
                <div class="flex flex-wrap items-center space-x-2 gap-y-2">
                    <select id="random-tag-filter" class="bg-black border-2 border-cher-hotpink text-cher-lightpink text-sm px-2 py-1.5 rounded focus:outline-none font-['VT323']">
                        <option value="ALL">✨ Any Tag</option>
                    </select>

                    <button onclick="spinAllSlots()" class="pixel-btn px-3 py-2 text-white">
                        Randomize
                    </button>
                    
                    <button onclick="promptSaveOutfit()" class="pixel-btn px-3 py-2 text-white bg-purple-900">
                        Save Match
                    </button>
                </div>
            </div>

            <!-- HUMAN PROPORTIONAL CLOSET STACK -->
            <div class="w-full max-w-xl flex flex-
